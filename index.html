<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>黃彥銘 | Unity Engineer Portfolio</title>
<meta name="description" content="黃彥銘 Unity Engineer 作品集">
<style>
  :root{color-scheme:light;--bg:#efe8da;--ink:#1c1c1a;--muted:#8a877f;--line:#e2dfd8;--card:#fff;
    --radius:20px;
    --shadow:0 1px 2px rgba(40,34,20,.05),0 4px 8px -2px rgba(40,34,20,.05),0 12px 20px -6px rgba(40,34,20,.07),0 26px 40px -14px rgba(40,34,20,.08);
    --chip-bg:rgba(255,255,255,.82);
    --font:"Helvetica Neue","Inter",-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
  *{box-sizing:border-box;margin:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}

  .title-chip,.dl-btn{position:fixed;top:20px;z-index:20;height:44px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;
    border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--ink);
    background:var(--chip-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 4px 18px rgba(0,0,0,.05);
    transition:top .3s,height .3s,padding .3s,opacity .3s,background .2s,color .2s,box-shadow .3s}
  .title-chip{left:20px;padding:0 20px 0 16px;gap:10px}
  .title-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--ink);flex:none}
  .title-chip .name{font-size:14px;font-weight:600;letter-spacing:.02em;transition:font-size .3s}
  .title-chip .role{font-size:13px;color:var(--muted);max-width:140px;opacity:1;transition:max-width .3s,opacity .3s}
  .dl-btn{right:20px;padding:0 20px;gap:8px;font-size:13px;letter-spacing:.04em}
  .dl-btn svg{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:.3s}
  .dl-btn .lbl{max-width:80px;opacity:1;transition:max-width .3s,opacity .3s}
  .dl-btn:hover{background:var(--ink);color:var(--bg)}

  body.compact .title-chip,body.compact .dl-btn{top:12px;height:32px;opacity:.72;box-shadow:none}
  body.compact .title-chip{padding:0 12px;gap:8px}
  body.compact .title-chip .name{font-size:12px}
  body.compact .title-chip .role{max-width:0;opacity:0}
  body.compact .dl-btn{padding:0 10px;gap:0}
  body.compact .dl-btn .lbl{max-width:0;opacity:0}
  body.compact .dl-btn svg{width:14px;height:14px}
  body.compact .title-chip:hover,body.compact .dl-btn:hover{opacity:1}
  body.compact .title-chip:hover{padding:0 16px 0 14px}
  body.compact .title-chip:hover .role{max-width:140px;opacity:1}
  body.compact .dl-btn:hover{padding:0 16px;gap:8px}
  body.compact .dl-btn:hover .lbl{max-width:80px;opacity:1}

  main{width:min(1360px,88vw,calc((100vh - 170px)*16/9));min-width:min(720px,94vw);margin:0 auto;padding:90px 0 120px}
  .page{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:56px;
    aspect-ratio:var(--ratio,16/9);box-shadow:var(--shadow);position:relative}
  .page-clip{position:absolute;inset:0;overflow:hidden;border-radius:calc(var(--radius) - 1px)}
  .page canvas{width:100%;height:100%;display:block;opacity:0;transition:opacity .5s}
  .page.ready canvas{opacity:1}
  .loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:12px;letter-spacing:.15em}
  .page.ready .loading{display:none}
  .hot{position:absolute;display:block;border-radius:6px;cursor:pointer;transition:background .2s,box-shadow .2s}
  .hot:hover{background:rgba(120,120,120,.14);box-shadow:0 0 0 2px rgba(120,120,120,.35)}
  .progress{position:fixed;left:0;top:0;height:2px;width:0;background:var(--ink);z-index:30}
  .counter{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:20;padding:7px 14px;border-radius:999px;
    font-size:12px;letter-spacing:.12em;color:var(--muted);border:1px solid var(--line);
    background:var(--chip-bg);backdrop-filter:blur(14px)}
  footer{text-align:center;color:var(--muted);font-size:12px;letter-spacing:.08em;padding-bottom:60px}
  footer a{color:inherit}

  .splash{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:var(--bg);transition:opacity .5s,visibility .5s}
  .splash.hide{opacity:0;visibility:hidden}
  .splash-inner{width:min(300px,70vw);text-align:center}
  .splash-name{font-size:15px;font-weight:600;letter-spacing:.04em}
  .splash-role{font-size:12px;color:var(--muted);margin-top:4px;letter-spacing:.1em}
  .splash-track{height:2px;background:var(--line);margin:28px 0 12px;overflow:hidden;border-radius:2px}
  .splash-fill{height:100%;width:0;background:var(--ink);transition:width .25s}
  .splash-track.indet .splash-fill{width:35%;animation:slide 1.2s ease-in-out infinite}
  @keyframes slide{0%{margin-left:-35%}100%{margin-left:100%}}
  .splash-text{font-size:12px;color:var(--muted);letter-spacing:.1em;font-variant-numeric:tabular-nums}
  .splash-err{display:none;font-size:13px;color:var(--muted);line-height:1.8}
  .splash-err a{color:var(--ink)}

  .modal{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:20px;
    background:rgba(15,15,14,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .modal.open{display:grid;animation:fade .2s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal-box{width:min(1100px,100%,calc((100vh - 120px)*16/9));position:relative}
  .modal-frame{aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4)}
  .modal-frame iframe{width:100%;height:100%;border:0;display:block}
  .modal-close{position:absolute;right:0;top:-48px;height:38px;padding:0 16px;border-radius:999px;
    border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;font:inherit;font-size:13px;letter-spacing:.06em;cursor:pointer}
  .modal-close:hover{background:#fff;color:#111}

  @media (max-width:700px){
    .title-chip .role{display:none}
    .title-chip,.dl-btn{top:12px;height:38px}
    .title-chip{left:12px}.dl-btn{right:12px;padding:0 14px}
    body.compact .title-chip,body.compact .dl-btn{height:30px}
    main{width:100%;min-width:0;padding:64px 8px 90px}
    .page{margin-bottom:28px}
  }
</style>
</head>
<body>
  <div class="splash" id="splash">
    <div class="splash-inner">
      <div class="splash-name">黃彥銘</div>
      <div class="splash-role">UNITY ENGINEER</div>
      <div class="splash-track indet" id="strack"><div class="splash-fill" id="sfill"></div></div>
      <div class="splash-text" id="stext">LOADING</div>
      <div class="splash-err" id="serr">無法載入預覽。<br>請直接<a href="HuangYanMing-Portfolio.pdf">開啟 PDF</a>。</div>
    </div>
  </div>

  <div class="progress" id="bar"></div>
  <a class="title-chip" href="#top"><span class="dot"></span><span class="name">黃彥銘</span><span class="role">Unity Engineer</span></a>
  <a class="dl-btn" href="HuangYanMing-Portfolio.pdf" download aria-label="下載 PDF" title="下載 PDF">
    <svg viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></svg><span class="lbl">下載 PDF</span></a>

  <main id="top"><div id="pages"></div></main>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="影片播放">
    <div class="modal-box">
      <button class="modal-close" id="mclose">關閉 ✕</button>
      <div class="modal-frame" id="mframe"></div>
    </div>
  </div>

  <div class="counter" id="counter">— / —</div>
  <footer>© 2026 Huang, Yan Ming · <a href="https://github.com/ming19991217">GitHub</a></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(async function(){
  const URL_PDF="HuangYanMing-Portfolio.pdf";
  const $=id=>document.getElementById(id);
  const wrap=$("pages"), counter=$("counter"), bar=$("bar"), modal=$("modal"), mframe=$("mframe");
  const splash=$("splash"), strack=$("strack"), sfill=$("sfill"), stext=$("stext");

  function ytId(u){
    try{const x=new URL(u);
      if(x.hostname==="youtu.be") return x.pathname.slice(1);
      if(x.hostname.endsWith("youtube.com")) return x.searchParams.get("v");
    }catch(e){} return null;
  }
  function openVideo(id){
    mframe.innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id)+'?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>';
    modal.classList.add("open"); document.body.style.overflow="hidden";
  }
  function closeVideo(){ modal.classList.remove("open"); mframe.innerHTML=""; document.body.style.overflow=""; }
  $("mclose").addEventListener("click",closeVideo);
  modal.addEventListener("click",e=>{ if(e.target===modal) closeVideo(); });
  addEventListener("keydown",e=>{ if(e.key==="Escape") closeVideo(); });

  function onScroll(){
    const h=document.documentElement, y=h.scrollTop;
    bar.style.width=(y/Math.max(1,h.scrollHeight-h.clientHeight)*100)+"%";
    document.body.classList.toggle("compact", y>80);
  }
  addEventListener("scroll",onScroll,{passive:true}); onScroll();

  const mb=n=>(n/1048576).toFixed(1);
  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const task=pdfjsLib.getDocument(URL_PDF);
    task.onProgress=({loaded,total})=>{
      if(total){
        strack.classList.remove("indet");
        sfill.style.width=Math.min(100,loaded/total*100)+"%";
        stext.textContent="LOADING  "+Math.floor(loaded/total*100)+"%  ·  "+mb(loaded)+" / "+mb(total)+" MB";
      }else stext.textContent="LOADING  "+mb(loaded)+" MB";
    };
    const pdf=await task.promise;
    const total=pdf.numPages; counter.textContent="1 / "+total;
    stext.textContent="RENDERING";
    const first=await pdf.getPage(1), v0=first.getViewport({scale:1}), ratio=v0.width/v0.height;

    const els=[];
    for(let i=1;i<=total;i++){
      const d=document.createElement("div");
      d.className="page"; d.dataset.n=i; d.style.setProperty("--ratio",ratio);
      d.innerHTML='<div class="page-clip"><div class="loading">LOADING</div><canvas></canvas></div>';
      wrap.appendChild(d); els.push(d);
    }
    const rendered=new Set();
    async function render(i){
      if(rendered.has(i)) return; rendered.add(i);
      const page=await pdf.getPage(i), el=els[i-1], cv=el.querySelector("canvas"), clip=el.querySelector(".page-clip");
      const vp0=page.getViewport({scale:1});
      const vp=page.getViewport({scale:el.clientWidth*Math.min(devicePixelRatio||1,2)/vp0.width});
      cv.width=vp.width; cv.height=vp.height;
      await page.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;
      el.classList.add("ready");
      if(i===1) splash.classList.add("hide");
      (await page.getAnnotations()).forEach(a=>{
        if(a.subtype!=="Link"||!a.url) return;
        const [x1,y1,x2,y2]=vp0.convertToViewportRectangle(a.rect);
        const link=document.createElement("a");
        link.className="hot"; link.href=a.url;
        link.style.cssText=`left:${Math.min(x1,x2)/vp0.width*100}%;top:${Math.min(y1,y2)/vp0.height*100}%;width:${Math.abs(x2-x1)/vp0.width*100}%;height:${Math.abs(y2-y1)/vp0.height*100}%`;
        const yt=ytId(a.url);
        if(yt){ link.title="播放影片"; link.addEventListener("click",e=>{e.preventDefault();openVideo(yt);}); }
        else if(/^https?:/.test(a.url)){ link.target="_blank"; link.rel="noopener noreferrer"; }
        clip.appendChild(link);
      });
    }
    const lazy=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting) render(+e.target.dataset.n);}),{rootMargin:"1200px 0px"});
    const seen=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting) counter.textContent=e.target.dataset.n+" / "+total;}),{rootMargin:"-45% 0px -45% 0px"});
    els.forEach(e=>{lazy.observe(e);seen.observe(e);});
    setTimeout(()=>splash.classList.add("hide"),8000);
  }catch(err){
    console.error(err);
    strack.style.display="none"; stext.style.display="none"; $("serr").style.display="block";
    counter.style.display="none";
  }
})();
</script>
</body>
</html>
